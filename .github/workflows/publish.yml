name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync version files to match tag
        id: sync
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1-2)
          echo "Syncing files to version ${VERSION} (series ${MAJOR_MINOR})..."

          sed -i "s/__version__ = \".*\"/__version__ = \"${VERSION}\"/" netbox_render/version.py
          sed -i -E "s/^(\| [0-9]+\.[0-9]+\.x[[:space:]]*\|[[:space:]]*)[0-9]+\.[0-9]+\.[0-9]+/\1${VERSION}/" README.md
          sed -i "s/^version: .*/version: ${MAJOR_MINOR}/" netbox-plugin.yaml
          sed -i -E "s/(release: )[0-9]+\.[0-9]+\.[0-9]+/\1${VERSION}/" netbox-plugin.yaml

          grep -q "| ${VERSION}" README.md || {
            echo "::error::README compat table did not update to ${VERSION}"
            exit 1
          }
          grep -q "release: ${VERSION}" netbox-plugin.yaml || {
            echo "::error::netbox-plugin.yaml did not update to ${VERSION}"
            exit 1
          }

          if git diff --quiet; then
            echo "All files already match v${VERSION}"
          else
            echo "Updated files:"
            git diff --stat
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add netbox_render/version.py README.md netbox-plugin.yaml
            git commit -m "chore: bump version to ${VERSION} [skip ci]"
            git push origin main
            git tag -f "${TAG}"
            git push -f origin "refs/tags/${TAG}"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION=$(sed -n 's/.*__version__ *= *"\([^"]*\)".*/\1/p' netbox_render/version.py)
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Version mismatch: tag says ${TAG_VERSION} but version.py says ${FILE_VERSION}"
            exit 1
          fi
          if ! grep -q "| ${FILE_VERSION}" README.md; then
            echo "::error::README compat table missing version ${FILE_VERSION}"
            exit 1
          fi
          if ! grep -q "release: ${FILE_VERSION}" netbox-plugin.yaml; then
            echo "::error::netbox-plugin.yaml missing release ${FILE_VERSION}"
            exit 1
          fi
          echo "Version ${FILE_VERSION} confirmed in version.py, README.md, and netbox-plugin.yaml"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Auto-update CHANGELOG if needed
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          VERSION="${TAG#v}"

          if grep -q "^## v\?${VERSION}\b" CHANGELOG.md; then
            echo "CHANGELOG already has entry for v${VERSION}, skipping"
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log "${TAG}" --pretty=format:"- %s" --no-merges)
          fi

          {
            echo "# Changelog"
            echo ""
            echo "## v${VERSION} (${DATE})"
            echo ""
            echo "${COMMITS}"
            echo ""
            sed -n '/^## /,$p' CHANGELOG.md
          } > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for ${TAG} [skip ci]"
          git push origin main
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
